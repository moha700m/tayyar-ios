name: Tayyar
options:
  bundleIdPrefix: com.moha700m
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Tayyar:
    type: application
    platform: iOS
    sources: [Tayyar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moha700m.tayyar
        PRODUCT_NAME: Tayyar
        INFOPLIST_FILE: Tayyar/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
  TayyarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TayyarTests]
    dependencies:
      - target: Tayyar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moha700m.tayyar.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  Tayyar:
    build:
      targets:
        Tayyar: all
        TayyarTests: [test]
    test:
      targets: [TayyarTests]
