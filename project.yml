name: Tayyar
options:
  bundleIdPrefix: com.mgz
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Tayyar:
    type: application
    platform: iOS
    sources: [Tayyar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mgz.tayyar
        PRODUCT_NAME: Tayyar
        INFOPLIST_FILE: Tayyar/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.1"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
