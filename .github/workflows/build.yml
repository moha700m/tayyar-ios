name: Build unsigned IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Tayyar.xcodeproj -scheme Tayyar -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -200
      - name: Package IPA
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/Tayyar.app
          test -f "$APP/Tayyar"
          SZ=$(stat -f%z "$APP/Tayyar"); echo "binary $SZ"; [ "$SZ" -gt 51200 ]
          mkdir Payload && cp -R "$APP" Payload/ && zip -qry Tayyar-unsigned.ipa Payload
          IS=$(stat -f%z Tayyar-unsigned.ipa); echo "ipa $IS"; [ "$IS" -gt 102400 ]
      - uses: actions/upload-artifact@v4
        with:
          name: Tayyar-unsigned-ipa
          path: Tayyar-unsigned.ipa
          if-no-files-found: error
